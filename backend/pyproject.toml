[project]
name = "homecloud"
version = "1.0.0"
description = "Spin up Ubuntu and Windows VMs on Proxmox from a web page"
readme = "../README.md"
authors = [{ name = "Gavin Fancher", email = "gavinfancher02@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "proxmoxer>=2.2",
    "requests>=2.32",
    "pycdlib>=1.14",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
