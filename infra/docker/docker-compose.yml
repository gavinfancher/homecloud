services:
  controller:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
    container_name: homecloud
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: ../../.env
    volumes:
      - ../../.homecloud:/app/.homecloud
      - ../../ssh:/mnt/ssh:ro
      # controller writes Caddy site files into this volume
      - caddy_sites:/etc/caddy/sites
      # controller writes CoreDNS zone files into this volume
      - coredns_zones:/etc/coredns
    working_dir: /app
    depends_on:
      caddy:
        condition: service_started
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.4
    container_name: homecloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homecloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-homecloud}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homecloud} -d ${POSTGRES_DB:-homecloud}"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2
    container_name: homecloud-caddy
    restart: unless-stopped
    # No public ports needed — cloudflared reaches Caddy over the compose
    # network using the service name "caddy".
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # caddy_sites volume is read-only for Caddy; the controller writes here
      - caddy_sites:/etc/caddy/sites:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: homecloud-cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - caddy

  coredns:
    image: coredns/coredns:latest
    container_name: homecloud-coredns
    restart: unless-stopped
    command: -conf /etc/coredns/Corefile
    volumes:
      - ../coredns/Corefile:/etc/coredns/Corefile:ro
      # controller writes db.homecloud.dev into this shared volume
      - coredns_zones:/etc/coredns
    ports:
      # Bind on tailnet IP only — avoids conflict with systemd-resolved on 127.0.0.53
      - "${CONTROL_NODE_TAILSCALE_IP:?set CONTROL_NODE_TAILSCALE_IP}:53:53/udp"
      - "${CONTROL_NODE_TAILSCALE_IP:?set CONTROL_NODE_TAILSCALE_IP}:53:53/tcp"

volumes:
  caddy_sites:
  coredns_zones:
  postgres_data:
