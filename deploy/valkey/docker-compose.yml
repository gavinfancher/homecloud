services:
  valkey:
    image: valkey/valkey:8
    container_name: homecloud-valkey
    restart: unless-stopped
    command: valkey-server --requirepass ${VALKEY_PASSWORD:-valkey}
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a ${VALKEY_PASSWORD:-valkey} --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  valkey_data:
