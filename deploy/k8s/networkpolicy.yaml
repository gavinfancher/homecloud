# Only cloudflared may open connections to the API. (Outbound is open: it calls Proxmox and Postgres.) Everything arrives through
# the tunnel, so nothing else in the cluster has a reason to reach it.
# (Kubelet health probes come from the node and are allowed regardless.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: homecloud-ingress
spec:
  podSelector:
    matchLabels:
      app: homecloud
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared
      ports:
        - port: 8000
