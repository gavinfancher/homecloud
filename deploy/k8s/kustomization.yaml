# Everything homecloud runs in the cluster. Argo CD (deploy/argocd/homecloud.yaml) watches
# this directory on main and applies it.
#
#   kubectl kustomize deploy/k8s     # see exactly what Argo will apply
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: homecloud

resources:
  - namespace.yaml
  - api.yaml
  - cloudflared.yaml
  - networkpolicy.yaml
  - infisical-secret.yaml

# The one line CI changes: after each image build on main, the `release` job in
# .github/workflows/ci.yml sets newTag to the commit's short SHA and pushes.
images:
  - name: ghcr.io/gavinfancher/homecloud
    newTag: "803f5bf"
