# The `homecloud` Secret both pods read, kept in sync with Infisical by the Infisical operator
# (installed by the homek8s repo). No values here: they live in Infisical, project homecloud,
# env prod, at the root. Edit one there and within a minute the operator updates the Secret and
# restarts the Deployments marked secrets.infisical.com/auto-reload.
#
# Keys: HOMECLOUD_DATABASE_URL, HOMECLOUD_ADMIN_PASSWORD_HASH, HOMECLOUD_PROXMOX_TOKEN_ID,
# HOMECLOUD_PROXMOX_TOKEN_SECRET, HOMECLOUD_WINDOWS_ADMIN_PASSWORD, HOMECLOUD_SSH_KEYS,
# TUNNEL_TOKEN.
#
#   kubectl -n homecloud describe infisicalsecret homecloud   # did it sync?
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: homecloud
spec:
  hostAPI: https://app.infisical.com/api
  resyncInterval: 60
  authentication:
    universalAuth:
      secretsScope:
        projectSlug: homecloud-0d9w
        envSlug: prod
        secretsPath: /
      # A machine identity that's a Viewer on the homecloud project only. Made by hand, never in git:
      #   kubectl -n infisical-operator-system create secret generic infisical-homecloud-identity \
      #     --from-literal=clientId=... --from-literal=clientSecret=...
      credentialsRef:
        secretName: infisical-homecloud-identity
        secretNamespace: infisical-operator-system
  managedKubeSecretReferences:
    - secretName: homecloud
      secretNamespace: homecloud
      creationPolicy: Owner
