label: Tailscale
description: Joins your tailnet under the instance name. Required — the instance's hostname, DNS record and SSH access all go through the tailnet. Tailscale itself is preinstalled in the base image. Runs last, so an instance only appears on the tailnet once everything else is set up.
required: true
order: 90
vars:
  - name: tailscale_accept_routes
    label: Accept subnet routes
    type: bool
    default: true
  - name: tailscale_ssh
    label: Enable Tailscale SSH
    type: bool
    default: false
