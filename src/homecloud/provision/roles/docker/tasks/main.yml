- name: Install Docker
  ansible.builtin.shell: curl -fsSL https://get.docker.com | sh
  args:
    creates: /usr/bin/docker

- name: Start Docker
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true

- name: Let the login user run docker
  ansible.builtin.user:
    name: "{{ homecloud_user }}"
    groups: docker
    append: true
