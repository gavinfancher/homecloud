<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>homecloud</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="header">
    <a class="brand" href="/">
      <span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M17.5 19a4.5 4.5 0 0 0 .5-8.97A6 6 0 0 0 6.34 9.5 4 4 0 0 0 7 19z" stroke="#3fd79a" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      homecloud
    </a>
    <span class="spacer"></span>
    <a class="header-link" href="https://dash.gavinf.com">Dashboard</a>
    <button class="header-link" id="sign-out" type="button">Sign out</button>
  </header>

  <main class="page">
    <div class="page-head">
      <div>
        <h1>Virtual machines</h1>
        <p>Ubuntu 26.04 or Windows 11 on Proxmox, with a LAN address from DHCP.</p>
      </div>
      <span class="spacer"></span>
      <button class="btn primary" id="new-vm" type="button">New VM</button>
    </div>

    <form class="create panel" id="create" hidden autocomplete="off">
      <div>
        <p class="label">Operating system</p>
        <div class="choices" id="os-choices"></div>
      </div>
      <div class="field" style="max-width: 320px">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" class="mono" maxlength="15" spellcheck="false"
               placeholder="web1" pattern="[a-z]([a-z0-9\-]{0,13}[a-z0-9])?" required>
      </div>
      <div>
        <p class="label">Size</p>
        <div class="choices" id="presets" style="margin-bottom: 12px"></div>
        <div class="row">
          <div class="field"><label for="cores">vCPUs</label><input id="cores" name="cores" type="number" min="1" required></div>
          <div class="field"><label for="memory_gb">Memory (GB)</label><input id="memory_gb" name="memory_gb" type="number" min="1" required></div>
          <div class="field"><label for="disk_gb">Disk (GB)</label><input id="disk_gb" name="disk_gb" type="number" min="1" required></div>
        </div>
      </div>
      <p class="muted" id="os-note" style="margin: 0; font-size: 13px"></p>
      <div class="actions">
        <button class="btn primary" type="submit" id="create-submit">Create</button>
        <button class="btn" type="button" id="create-cancel">Cancel</button>
        <span class="error-text" id="create-error" hidden></span>
      </div>
    </form>

    <div class="banner" id="pve-down" hidden>Can't reach Proxmox right now. Power state may be out of date.</div>
    <p class="label">Instances</p>
    <div class="vms" id="vms"><div class="empty">Loading…</div></div>
  </main>

  <script src="/static/config.js"></script>
  <script src="/static/auth.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
