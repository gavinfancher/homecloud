# One Worker for every gavinf.com site (Git-connected deploy on push to main).
# Hostname routing lives in worker.js:
#   gavinf.com / www / auth / dash  → portal SPA   (../dashboard → dist/portal)
#   homecloud.gavinf.com            → console SPA  (..           → dist/console)
#   docs.gavinf.com                 → VitePress docs (../docs    → dist/docs)
#   proxmox.gavinf.com              → rail shell + passthrough to the tunnel origin
name = "gavinf-prod"
account_id = "2750df8a500fb8335c195bad8cccc14a"
compatibility_date = "2026-06-13"
main = "worker.js"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
